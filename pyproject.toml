[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mypkg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "analysis-helpers",
    "pyhf>=0.7.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mypkg"]

[tool.uv]
package = true

[tool.uv.sources]
analysis-helpers = { git = "ssh://git@github.com/cpviolation/analysis_helpers.git" }
pyhf = { git = "https://github.com/scikit-hep/pyhf.git" }
